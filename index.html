<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .progress-container {
            width: 90vw;
            max-width: 600px;
            height: 30px;
            background: #333;
            border-radius: 20px;
            overflow: hidden;
            margin: 20px auto;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4d4d, #ff9933);
            transition: width 0.3s ease;
        }

        /* obere linke Ecke */
        .corner-box {
            position: absolute;
            top: 20px;
            left: 20px;
            text-align: left;
        }

        .corner-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .corner-percent {
            font-size: 1.2rem;
            color: #ff9933;
        }
    </style>
</head>
<body>

    <!-- ⭐ OBERES LINKES NEUES TREFFEN ⭐ -->
    <div class="corner-box">
        <div class="corner-title">Gemeinsam Silvester (30. Dez)</div>
        <div class="corner-percent" id="cornerPercent">0%</div>
    </div>

    <div class="container">
        <h1>Countdown</h1>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p id="mainPercent" style="font-size: 1.5rem;">0%</p>
    </div>

    <script>
        // === SETTINGS ===
        const startDate = new Date("2025-12-06T00:00:00");
        const endDate = new Date("2025-12-30T00:00:00");

        function updateProgress() {
            const now = new Date();
            const total = endDate - startDate;
            const current = now - startDate;

            let progress = (current / total) * 100;
            if (progress < 0) progress = 0;
            if (progress > 100) progress = 100;

            // Balken in der Mitte
            document.getElementById("progressBar").style.width = progress + "%";
            document.getElementById("mainPercent").textContent = progress.toFixed(1) + "%";

            // Ecke oben links
            document.getElementById("cornerPercent").textContent = progress.toFixed(1) + "%";
        }

        updateProgress();
        setInterval(updateProgress, 1000);
    </script>

</body>
</html>
